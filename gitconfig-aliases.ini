[user]
    name  = Your Name
    email = you@example.com
    
[alias]
    # ─── Setup ────────────────────────────────────────────────────
    # Initialize git flow on a repo starting from main or master
    init-flow = "!f() { \
        if git show-ref --verify --quiet refs/heads/main; then \
            MAIN_BRANCH=\"main\"; \
        elif git show-ref --verify --quiet refs/heads/master; then \
            MAIN_BRANCH=\"master\"; \
        else \
            echo \"❌ Neither 'main' nor 'master' branch found.\"; \
            exit 1; \
        fi; \
        git checkout \"$MAIN_BRANCH\" && \
        git checkout -b develop && \
        git push -u origin develop && \
        echo \"✅ Branch develop created and pushed to origin\"; \
    }; f"

    # ─── Branch lifecycle ─────────────────────────────────────────
    # Usage: git start <type> <name> [--json]
    start = "!bash ~/.git-scripts/git-start.sh"

    # Interactive commit with Conventional Commits template
    c       = "!bash ~/.git-scripts/git-commit.sh"

    # Merge branch and close with auto-generated message
    finish  = "!bash ~/.git-scripts/git-finish.sh"

    # ─── Utility ──────────────────────────────────────────────────
    # Push current branch to origin [--json]
    publish = "!bash ~/.git-scripts/git-publish.sh"

    # Show all active flow branches
    st-flow = "!git branch | grep -E '(feature|bugfix|release|hotfix|support)/' || true"

    # Checkout develop + pull
    sync    = "!git checkout develop && git pull origin develop"
